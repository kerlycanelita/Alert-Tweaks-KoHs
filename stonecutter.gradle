plugins {
	id 'dev.kikugie.stonecutter'
	// <=1.21.11 is obfuscated (remap plugin + Mojang mappings), 26.1+ is not.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

stonecutter.active '26.2' /* [SC] DO NOT EDIT */

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds every supported Minecraft version and copies the jars to dist/<mod_version>/'
	dependsOn(stonecutter.tasks.named('build'))
	doLast {
		def out = file("dist/${project.mod_version}")
		out.mkdirs()
		stonecutter.versions.each { v ->
			copy {
				from(file("versions/${v.project}/build/libs")) { include '*.jar'; exclude '*-sources.jar' }
				into out
			}
		}
	}
}
